name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check cursor.js
          node --check photography.js
          node --check music.js
          node --check translations.js
          node --check dynamic-translations.js
          node --check i18n.js
      - name: Check language selection and CV routing
        run: node scripts/check_i18n.cjs
      - name: Package linked website files
        run: python3 scripts/build_site.py
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
